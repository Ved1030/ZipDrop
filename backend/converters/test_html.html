    <style>
    * {

    .document {

    }
    .page {
        background: white;

        margin: 20px auto;
        position: relative;
        overflow: hidden;
        transform-origin: top center;
    }
    .page-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
    }
    .page img {
        position: absolute;
        object-fit: cover;
    }
    .page span {
        position: absolute;
        white-space: pre;
    }
    @media print {
        body { background: white; padding: 0; }
        .page { box-shadow: none; margin: 0; page-break-after: always; }
    }
    /* Responsive scaling */
    @media (max-width: 800px) {
        .page {
            transform: scale(0.8);
        }
    }
    @media (max-width: 600px) {
        .page {
            transform: scale(0.6);
        }
    }
    @media (max-width: 400px) {
        .page {

        }
    }
